name: Build StreameX APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web shell
        run: npm run build

      - name: Validate Capacitor dependencies
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies['@capacitor/core'] !== '8.5.2' || p.dependencies['@capacitor/android'] !== '8.5.2' || p.devDependencies['@capacitor/cli'] !== '8.5.2') process.exit(1); console.log('Capacitor 8.5.2 dependencies OK')"

      # The old checked-in Android scaffold was incomplete. Generate a clean
      # Capacitor 8 Android project from the installed 8.5.2 packages instead.
      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreameX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
