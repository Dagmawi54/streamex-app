plugins { id 'com.android.application' }

android {
    namespace 'com.streamex.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.streamex.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.getcapacitor:capacitor-android:8.0.0'
}
